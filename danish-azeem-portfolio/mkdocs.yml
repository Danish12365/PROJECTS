site_name: Muhammad Danish Azeem
site_description: Data Analyst · Data Scientist · SAP S/4HANA Certified
site_author: Muhammad Danish Azeem
site_url: https://danish12365.github.io/PROJECTS/

repo_name: Danish12365/PROJECTS
repo_url: https://github.com/Danish12365/PROJECTS
theme:
  name: material
  language: en
  font:
    text: Sora
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Danish12365
      name: GitHub
    - icon: fontawesome/brands/kaggle
      link: https://www.kaggle.com/danishazeem36512
      name: Kaggle
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/muhammad-danish-094481387
      name: LinkedIn

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg];'
  - tags

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Projects: projects.md
  - Skills: skills.md
  - About: about.md
  - Resume: resume.md

extra_css:
  - stylesheets/extra.css
